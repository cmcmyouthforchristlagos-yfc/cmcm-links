<!-- PAGE 2 — GIVE: displayed during offering & special announcements.
     Sheet rows used: offering, project
     Pure giving focus — nothing else to distract. -->
<script>
  const SHEET_ID = "https://docs.google.com/spreadsheets/d/1gORaXofT5gZ7kPiqGrwyfV4-U6ORtb6p/edit?usp=sharing&ouid=105645331286037118685&rtpof=true&sd=true";
  const DATA = { offering: "0122735428", project: "0122765443" };
  function apply(){
    document.getElementById('offNum').textContent = DATA.offering;
    document.getElementById('projNum').textContent = DATA.project;
    document.getElementById('offBtn').setAttribute("onclick","copyText(DATA.offering,'Offering')");
    document.getElementById('projBtn').setAttribute("onclick","copyText(DATA.project,'Project')");
  }
</script>

<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMCM Youth For Christ — Give</title>
<style>
  :root{ --bg:#04140c; --card:#0d2a1a; --gold:#f5c542; --green:#3ddc84; --text:#f0fff6; --muted:#9fd9bb; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:radial-gradient(ellipse at top,#0d3a22,var(--bg) 70%);color:var(--text);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px;}
  .logo{margin:10px 0 12px;} .logo img{display:block;max-width:250px;width:62vw;height:auto;}
  h1{font-size:1.4rem;text-align:center;color:var(--gold);}
  p.sub{color:var(--muted);font-size:.9rem;margin:8px 0 6px;text-align:center;max-width:400px;}
  .verse{color:var(--muted);font-style:italic;font-size:.82rem;margin-bottom:24px;text-align:center;max-width:380px;}
  .grid{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;}
  button.give{display:block;width:100%;padding:22px 20px;background:var(--card);
    border:1px solid #1d5c3a;border-radius:18px;color:var(--text);cursor:pointer;
    text-align:center;transition:.15s;}
  button.give:active{transform:scale(.97);border-color:var(--gold);}
  .tag{display:inline-block;font-size:.72rem;letter-spacing:2px;color:var(--gold);
    border:1px solid var(--gold);border-radius:999px;padding:3px 12px;margin-bottom:10px;}
  .acct{font-size:1.7rem;font-weight:bold;letter-spacing:2px;color:var(--green);}
  .bank{font-size:.85rem;color:var(--muted);margin-top:4px;}
  .hint{font-size:.75rem;color:var(--muted);margin-top:8px;}
  .foot{margin-top:26px;color:var(--muted);font-size:.78rem;text-align:center;max-width:400px;}
</style>

<script>
  
  if(SHEET_ID.indexOf("PASTE")!==0){
    fetch("https://opensheet.elt.se/" + SHEET_ID + "/Sheet1")
      .then(function(r){ return r.json(); })
      .then(function(rows){
        rows.forEach(function(row){
          Object.keys(row).forEach(function(k){
            var v=row[k];
            if(v && typeof v==="string" && v!=="" && DATA[k]!==undefined) DATA[k]=v;
          });
        });
        apply();
      })
      .catch(function(){});
  }
  
  function copyText(txt,label){
    function done(){ alert((label?label+" account copied: ":"Copied: ")+txt); }
    function fallback(){
      var ta=document.createElement("textarea");
      ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand("copy"); done(); }
      catch(e){ prompt("Copy this number:", txt); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(txt).then(done).catch(fallback);
    } else { fallback(); }
  }
</script>
